; LoRa Su Yönetim Sistemi - firmware
;
;   pio run -e node          -> uç düğüm (adres 0x1001)
;   pio run -e node2         -> ikinci uç düğüm (adres 0x1002)
;   pio run -e gateway       -> gateway (önce include/secrets.h oluşturun)
;   pio test -e native       -> protokol birim testleri (bilgisayarda, kart gerekmez)
;
; Ayrıntılar: ../docs/05-kurulum.md

[platformio]
default_envs = node, gateway

[esp32]
platform = espressif32 @ ^6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall -Wextra

[env:node]
extends = esp32
build_src_filter = +<node/>
build_flags = ${esp32.build_flags} -DNODE_ADDRESS=0x1001

[env:node2]
extends = esp32
build_src_filter = +<node/>
build_flags = ${esp32.build_flags} -DNODE_ADDRESS=0x1002

[env:gateway]
extends = esp32
build_src_filter = +<gateway/>
lib_deps = bblanchon/ArduinoJson @ ^7.4.2

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
lib_ignore = E32Radio, FieldDevice
test_build_src = no
