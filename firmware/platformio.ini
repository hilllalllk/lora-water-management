; LoRa Water Management System - firmware (ESP32 DevKit V1 + Ebyte E32-433T20D)
;
;   pio run -e node          -> end node 0x1001, simulated field device (LED + pot)
;   pio run -e node2         -> end node 0x1002, simulated field device
;   pio run -e node-modbus   -> end node 0x1003, existing controller over Modbus RTU / RS-485
;   pio run -e gateway       -> Wi-Fi gateway (create include/secrets.h first)
;   pio test -e native       -> protocol + Modbus unit tests (on a PC, no board needed)
;
; Details: README.md, ../docs/05-kurulum.md

[platformio]
default_envs = node, gateway

[esp32]
platform = espressif32 @ ^6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall -Wextra

[env:node]
extends = esp32
build_src_filter = +<node/>
build_flags = ${esp32.build_flags} -DNODE_ADDRESS=0x1001

[env:node2]
extends = esp32
build_src_filter = +<node/>
build_flags = ${esp32.build_flags} -DNODE_ADDRESS=0x1002

[env:node-modbus]
extends = esp32
build_src_filter = +<node/>
build_flags = ${esp32.build_flags} -DNODE_ADDRESS=0x1003 -DFIELD_DEVICE_MODBUS

[env:gateway]
extends = esp32
build_src_filter = +<gateway/>
lib_deps = bblanchon/ArduinoJson @ ^7.4.2

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
; LoraProtocol and ModbusRtu are hardware independent and are tested here.
lib_ignore = E32Radio, FieldDevice
test_build_src = no
